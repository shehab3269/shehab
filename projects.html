<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Shehab Medhat</title>
<meta name="description" id="metaDesc" content="Apps and projects built by Shehab Medhat (shijz) — Flutter developer and content creator.">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="author" content="Shehab Medhat">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101c17">
<link rel="canonical" href="https://shehab-medhat.site/projects.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Shehab Medhat">
<meta property="og:title" content="Projects — Shehab Medhat">
<meta property="og:description" content="Apps and projects built by Shehab Medhat — Flutter developer and content creator.">
<meta property="og:url" content="https://shehab-medhat.site/projects.html">
<meta property="og:image" content="https://shehab-medhat.site/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Projects — Shehab Medhat">
<meta name="twitter:image" content="https://shehab-medhat.site/og-image.png">
<link rel="icon" href="https://shehab-medhat.site/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="https://shehab-medhat.site/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #101c17;
    --surface: #17251e;
    --surface-2: #1d2e25;
    --border: #2c4237;
    --text: #ebe4d4;
    --text-muted: #93a89b;
    --accent: #e8a33d;
    --accent-soft: #6fa787;
    --font-ui: 'JetBrains Mono', monospace;
    --font-body: 'IBM Plex Sans', sans-serif;
  }
  html[lang="ar"]{
    --font-ui: 'IBM Plex Sans Arabic', sans-serif;
    --font-body: 'IBM Plex Sans Arabic', sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 20% -10%, rgba(232,163,61,0.10), transparent 45%),
      radial-gradient(circle at 85% 110%, rgba(111,167,135,0.14), transparent 50%),
      linear-gradient(180deg, #0d1712 0%, #101c17 45%, #0c1712 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 500;
    min-height: 100vh;
    line-height: 1.7;
    padding-bottom: 40px;
  }
  html[lang="ar"] body{ line-height: 1.9; letter-spacing: 0; }

  .pbar{
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 5vw;
    background: rgba(13,23,18,.88);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .pbar a.home{
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: var(--text);
    text-decoration: none;
    font-family: var(--font-ui);
    font-size: 12.5px;
    font-weight: 700;
  }
  .pbar a.home:hover{ color: var(--accent); }
  .pbar a.home img{ width: 22px; height: 22px; border-radius: 5px; display: block; }
  .pbar .pbar-right{ margin-left: auto; display: flex; gap: 6px; align-items: center; }
  html[dir="rtl"] .pbar .pbar-right{ margin-left: 0; margin-right: auto; }

  .lang-btn{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .lang-btn:hover{ color: var(--accent); border-color: var(--accent); }
  .lang-btn.is-on{ color: var(--accent); border-color: var(--accent); background: rgba(232,163,61,.10); }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 26px 5vw 0; }

  .comment{
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 6px;
  }
  .comment .pr{ color: var(--accent); margin-right: 8px; }
  html[dir="rtl"] .comment .pr{ margin-right: 0; margin-left: 8px; }

  h1{
    font-family: var(--font-ui);
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  html[lang="ar"] h1{ letter-spacing: 0; }
  .lede{
    color: var(--text-muted);
    font-size: 15.5px;
    max-width: 640px;
    margin: 0 0 26px;
  }

  .pcard{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .phead{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .pname{
    font-family: var(--font-ui);
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
  }
  .ptag{
    font-family: var(--font-ui);
    font-size: 11px;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 9px;
  }
  .pdesc{
    color: var(--text);
    font-size: 14.5px;
    margin: 0 0 12px;
    max-width: 72ch;
  }
  .ptech{ display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .tech{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent-soft);
    background: rgba(111,167,135,.08);
    border: 1px solid rgba(111,167,135,.24);
    border-radius: 5px;
    padding: 3px 8px;
  }

  .shots-label{
    font-family: var(--font-ui);
    font-size: 11.5px;
    color: var(--text-muted);
    margin: 2px 0 10px;
    text-transform: lowercase;
  }
  .shots-label::before{ content: "$ "; color: var(--accent); }

  .shots{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .shots button{
    display: block;
    width: 100%;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface-2);
    cursor: zoom-in;
    aspect-ratio: 720 / 1600;
    line-height: 0;
    transition: border-color .2s, transform .2s;
  }
  .shots button:hover{ border-color: var(--accent); transform: translateY(-3px); }
  .shots img{ width: 100%; height: 100%; object-fit: cover; display: block; }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
    margin-top: 10px;
  }
  .grid .pcard{ margin-bottom: 0; }
  .grid .pname{ font-size: 15.5px; }
  .grid .pdesc{ font-size: 13.5px; }

  .foot{
    margin-top: 30px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--text-muted);
  }
  .foot a{ color: var(--accent); text-decoration: none; }
  .foot a:hover{ text-decoration: underline; }

  .lb{
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(6,11,9,.94);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 22px;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .lb.is-open{ display: flex; }
  .lb img{
    max-width: min(94vw, 460px);
    max-height: 88vh;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 30px 70px -25px rgba(0,0,0,.85);
  }
  .lb button{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    position: absolute;
    transition: color .15s, border-color .15s;
  }
  .lb button:hover{ color: var(--accent); border-color: var(--accent); }
  .lb .lb-close{ top: 16px; right: 16px; }
  html[dir="rtl"] .lb .lb-close{ right: auto; left: 16px; }
  .lb .lb-prev{ left: 14px; top: 50%; transform: translateY(-50%); }
  .lb .lb-next{ right: 14px; top: 50%; transform: translateY(-50%); }
  html[dir="rtl"] .lb .lb-prev{ left: auto; right: 14px; }
  html[dir="rtl"] .lb .lb-next{ right: auto; left: 14px; }
  .lb .lb-count{
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--text-muted);
  }

  @media (max-width: 560px){
    .wrap{ padding-top: 20px; }
    .pcard{ padding: 16px; }
    .shots{ grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .pdesc{ font-size: 14px; }
  }
</style>
</head>
<body>

<header class="pbar">
  <a class="home" href="/">
    <img src="https://shehab-medhat.site/shehab-logo.png" alt="Shehab Medhat" width="22" height="22">
    <span>sm@shehab-medhat.site</span>
  </a>
  <span class="pbar-right">
    <button type="button" class="lang-btn" data-lang="en">EN</button>
    <button type="button" class="lang-btn" data-lang="ar">عربي</button>
  </span>
</header>

<div class="wrap">
  <p class="comment"><span class="pr">$</span><span data-i18n="comment">ls projects/</span></p>
  <h1 data-i18n="heading">projects</h1>
  <p class="lede" data-i18n="lede">things I've built — shipped apps, tools and client work.</p>

  <div id="apps"></div>

  <p class="shots-label" data-i18n="more">more projects</p>
  <div class="grid" id="grid"></div>

  <div class="foot">
    <span>sm@shehab-medhat.site:~$ <span style="opacity:.6">_</span></span>
    <span><a href="/" data-i18n="back">← back to home</a></span>
  </div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button type="button" class="lb-close" id="lbClose" aria-label="Close">✕</button>
  <button type="button" class="lb-prev" id="lbPrev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button type="button" class="lb-next" id="lbNext" aria-label="Next">›</button>
  <span class="lb-count" id="lbCount"></span>
</div>

<script>
  "use strict";

  // To add a new app: drop screenshots into assets/shots/<folder>/shot-0N.jpg
  // and push one object below (shots + en/ar copy). It renders automatically.
  const APPS = [
    {
      shots: [1,2,3,4,5,6,7].map(n => "assets/shots/todo-app/shot-0" + n + ".jpg"),
      en: { name: "to-do-list", tag: "productivity · personal", desc: "A daily organizer that keeps your tasks, prayer times and focus time in one place — built to fight brain rot and keep the day on track.", tech: ["Flutter", "Dart", "Local storage"] },
      ar: { name: "to-do-list", tag: "إنتاجية · شخصي", desc: "منظّم يومي بيرتب المهام ومواقيت الصلاة ووقت التركيز في مكان واحد — اتعمل عشان يعالج تعفن الدماغ ويخلي يومك مظبوط.", tech: ["Flutter", "Dart", "تخزين محلي"] }
    },
    {
      shots: [1,2,3,4].map(n => "assets/shots/gym-app/shot-0" + n + ".jpg"),
      en: { name: "gym-app", tag: "fitness · health", desc: "Workouts, plans and progress tracking — the gym side of your day in one app.", tech: ["Flutter", "Dart"] },
      ar: { name: "gym-app", tag: "لياقة · صحة", desc: "تمارين وخطط ومتابعة تقدّم — كل حاجة في نادي الجيم في تطبيق واحد.", tech: ["Flutter", "Dart"] }
    },
    {
      shots: [1,2,3,4].map(n => "assets/shots/shipping/shot-0" + n + ".jpg"),
      en: { name: "shipping-app", tag: "logistics", desc: "Orders, rates and delivery tracking — shipping handled in one place.", tech: ["Flutter", "Dart"] },
      ar: { name: "shipping-app", tag: "شحن ولوجستيات", desc: "طلبات وأسعار وتتبّع للشحنات — الشحن كله مظبوط في مكان واحد.", tech: ["Flutter", "Dart"] }
    },
    {
      shots: [1,2].map(n => "assets/shots/payment/shot-0" + n + ".jpg"),
      en: { name: "payment-app", tag: "fintech · payments", desc: "Send, receive and track transactions without the friction.", tech: ["Flutter", "Dart"] },
      ar: { name: "payment-app", tag: "مدفوعات", desc: "ابعت واستقبل وتتبّع المعاملات من غير أي تعقيد.", tech: ["Flutter", "Dart"] }
    }
  ];

  const WORK = {
    en: [
      { name: "codeq", tag: "EdTech · Community", desc: "Programming education with a community layer — courses, challenges and discussion in one product, built from the ground up.", tech: ["Flutter", "Dart", "REST API", "MongoDB"] },
      { name: "tagit", tag: "ERP", desc: "An ERP that runs a business day-to-day — inventory, sales and internal workflows managed in one place.", tech: ["Flutter", "TypeScript", "MongoDB"] },
      { name: "portfolio-builds", tag: "Various", desc: "Landing pages, dashboards and client sites — smaller scope, same attention to detail.", tech: ["Flutter", "JavaScript"] }
    ],
    ar: [
      { name: "codeq", tag: "تعليم · مجتمع", desc: "تعليم برمجة مع طبقة مجتمع — كورسات وتحديات ونقاش في منتج واحد، مبني من الصفر.", tech: ["Flutter", "Dart", "REST API", "MongoDB"] },
      { name: "tagit", tag: "ERP", desc: "نظام ERP بيشغّل الشغل اليومي لأي بيزنس — مخزون ومبيعات وسير عمل داخلي في مكان واحد.", tech: ["Flutter", "TypeScript", "MongoDB"] },
      { name: "portfolio-builds", tag: "متفرق", desc: "صفحات لانداينج وداشبوردات ومواقع كلاينت — نطاق أصغر، لكن نفس الشغلة والاهتمام.", tech: ["Flutter", "JavaScript"] }
    ]
  };

  const I18N = {
    en: {
      title: "Projects — Shehab Medhat",
      desc: "Apps and projects built by Shehab Medhat (shijz) — Flutter developer and content creator.",
      comment: "ls projects/",
      heading: "projects",
      lede: "things I've built — shipped apps, tools and client work.",
      shots: "screenshots",
      more: "more projects",
      back: "← back to home"
    },
    ar: {
      title: "المشاريع — شهاب مدحت",
      desc: "تطبيقات ومشاريع بناها شهاب مدحت (shijz) — مطوّر فلاتر وصانع محتوى.",
      comment: "ls projects/",
      heading: "المشاريع",
      lede: "حاجات بنيتها — تطبيقات منشورة وأدوات وشغل كلاينت.",
      shots: "سكرينشوتات",
      more: "مشاريع تانية",
      back: "→ رجوع للرئيسية"
    }
  };

  const appsEl = document.getElementById("apps");
  const gridEl = document.getElementById("grid");

  function shotsFor(app, lang, appIndex){
    return app.shots.map((src, i) =>
      '<button type="button" data-app="' + appIndex + '" data-i="' + i + '" aria-label="' + app[lang].name + ' screenshot ' + (i + 1) + '">' +
        '<img src="' + src + '" alt="' + app[lang].name + ' screenshot ' + (i + 1) + '" loading="lazy" width="720" height="1600">' +
      '</button>'
    ).join("");
  }

  function render(lang){
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";
    const t = I18N[lang];
    document.title = t.title;
    document.getElementById("metaDesc").setAttribute("content", t.desc);
    try{ localStorage.setItem("shehab_lang", lang); }catch(e){}
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("is-on", b.dataset.lang === lang));
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const k = el.dataset.i18n;
      if(t[k] !== undefined && typeof t[k] === "string") el.textContent = t[k];
    });

    appsEl.innerHTML = APPS.map((app, ai) => {
      const c = app[lang];
      return '<article class="pcard">' +
        '<div class="phead"><span class="pname">' + c.name + '</span><span class="ptag">' + c.tag + '</span></div>' +
        '<p class="pdesc">' + c.desc + '</p>' +
        '<div class="ptech">' + c.tech.map(x => '<span class="tech">' + x + '</span>').join("") + '</div>' +
        '<p class="shots-label">' + t.shots + '</p>' +
        '<div class="shots" data-shots="' + ai + '">' + shotsFor(app, lang, ai) + '</div>' +
      '</article>';
    }).join("");

    gridEl.innerHTML = WORK[lang].map(p =>
      '<article class="pcard">' +
        '<div class="phead"><span class="pname">' + p.name + '</span><span class="ptag">' + p.tag + '</span></div>' +
        '<p class="pdesc">' + p.desc + '</p>' +
        '<div class="ptech">' + p.tech.map(x => '<span class="tech">' + x + '</span>').join("") + '</div>' +
      '</article>'
    ).join("");

    appsEl.querySelectorAll(".shots button").forEach(b => {
      b.addEventListener("click", () => openLb(Number(b.dataset.app), Number(b.dataset.i)));
    });
  }

  document.querySelectorAll(".lang-btn").forEach(b => {
    b.addEventListener("click", () => render(b.dataset.lang));
  });

  // ----- lightbox -----
  const lb = document.getElementById("lb");
  const lbImg = document.getElementById("lbImg");
  const lbCount = document.getElementById("lbCount");
  let cur = { app: 0, i: 0 };

  function paintLb(){
    const app = APPS[cur.app];
    lbImg.src = app.shots[cur.i];
    lbImg.alt = app.en.name + " screenshot " + (cur.i + 1);
    lbCount.textContent = (cur.i + 1) + " / " + app.shots.length;
  }
  function openLb(appIndex, shotIndex){
    cur = { app: appIndex, i: shotIndex };
    paintLb();
    lb.classList.add("is-open");
    document.body.style.overflow = "hidden";
  }
  function closeLb(){
    lb.classList.remove("is-open");
    document.body.style.overflow = "";
  }
  function step(n){
    const len = APPS[cur.app].shots.length;
    cur.i = (cur.i + n + len) % len;
    paintLb();
  }
  document.getElementById("lbClose").addEventListener("click", closeLb);
  document.getElementById("lbPrev").addEventListener("click", () => step(-1));
  document.getElementById("lbNext").addEventListener("click", () => step(1));
  lb.addEventListener("click", e => { if(e.target === lb) closeLb(); });
  document.addEventListener("keydown", e => {
    if(!lb.classList.contains("is-open")) return;
    if(e.key === "Escape") closeLb();
    else if(e.key === "ArrowRight") step(document.documentElement.dir === "rtl" ? -1 : 1);
    else if(e.key === "ArrowLeft") step(document.documentElement.dir === "rtl" ? 1 : -1);
  });

  let saved = "en";
  try{ saved = localStorage.getItem("shehab_lang") || "en"; }catch(e){}
  render(saved === "ar" ? "ar" : "en");
</script>
</body>
</html>
